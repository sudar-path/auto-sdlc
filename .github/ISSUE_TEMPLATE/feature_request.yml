name: Feature request
description: Propose a change to the pipeline, tools, or developer workflow
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it works? Prefer checks that can be expressed as tests.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Does not require changes under upstream/ (read-only)
        - label: Keeps the order-file contract unchanged, or explains the migration
